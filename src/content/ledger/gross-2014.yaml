supports: "VERBATIM, the sentence the day is built on: the literature is insufficient to offer guidance regarding the appropriate time for discharge of patients at increased perioperative risk from OSA from the surgical facility. The recommendation that follows carries the strength qualifier STRONGLY AGREE (consultants and ASA members), not an evidence grade: that such patients should not be discharged from the recovery area to an unmonitored setting, meaning home or an unmonitored hospital bed, until they are no longer at risk of postoperative respiratory depression. See gaps.md for the full quoted wording."
