supports: "THE ONLY PRIMARY SOURCE FOUND FOR A 0.04 mg ADULT NALOXONE INCREMENT, AND IT DOES NOT SUPPORT THE CLAIM AS THE CARD WORDS IT. Retrospective case series, medical-record review, no control group. Setting was the EMERGENCY DEPARTMENT via medical toxicology consultation, not the PACU. 15 patients, of whom 12 had ingested methadone 30-180 mg. Starting dose 0.04 mg IV, titrated; median total 0.08 mg, range 0.04-0.12 mg. 2 of 15 developed acute opioid withdrawal after the 0.08 mg dose. Conclusion, VERBATIM: 'ED patients with moderate to severe opioid-induced ventilatory depression can be reversed using 0.04 mg IV naloxone with appropriate dose titration.' NOTE THE MISMATCH: the card states an increment range of 0.04 to 0.1 mg; this study's observed range runs to 0.12 mg, and the population and setting are both wrong for a PACU page. No society guideline recommending 0.04 mg adult increments was found; the ASA/ASRA neuraxial-opioid respiratory depression guideline gives no naloxone dose at all."
