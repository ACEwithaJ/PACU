supports: "NEGATIVE FINDING ROW. This is the society guideline nearest to the Day 2 laryngospasm ladder and IT DOES NOT CONTAIN ONE. It addresses laryngospasm only as a risk. VERBATIM: 'Laryngospasm is a protective exaggeration of the normal glottic closure reflex, and is produced by stimulation of the superior laryngeal nerve.' 'Typically, laryngospasm causes signs of upper airway obstruction (including stridor) that can precede complete airway obstruction and requires an immediate response.' 'If not relieved promptly, laryngospasm may result in post-obstructive pulmonary oedema (also known as negative pressure pulmonary oedema) and hypoxic cardiac arrest.' The only pharmacological statement is about doxapram: 'Doxapram has been used to prevent and/or treat laryngospasm, although it is associated with cardiovascular stimulation and robust evidence to support its use for this indication is lacking.' No jaw thrust, no laryngospasm notch, no succinylcholine for post-extubation laryngospasm. Currency checked on das.uk.com, which still lists this as the current DAS extubation guideline."
