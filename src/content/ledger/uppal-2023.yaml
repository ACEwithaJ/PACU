supports: "Suspect PDPH if headache or neurological symptoms, possibly relieved lying flat, occur within 5 days of a neuraxial procedure (certainty moderate); inpatients reviewed, outpatients instructed to report (grade A). Conservative: bed rest not routinely supported (C); oral hydration (C); multimodal analgesia with acetaminophen/NSAIDs for all (B); caffeine may be offered in first 24 h, max 900 mg/day (B); steroids, theophylline, triptans, ACTH, neostigmine/atropine, gabapentin not supported (I). EBP when refractory and impairing ADLs (B); 15-20 mL typical, >30 mL no added benefit; if within 48 h counsel on likely repeat (B); imaging for nonorthostatic headache, onset >5 days, focal deficits, visual change, altered consciousness, seizures (B); alternative diagnoses SDH and CVST; follow up until resolution (B). Full recommendation text in extraction-findings-2.md."
