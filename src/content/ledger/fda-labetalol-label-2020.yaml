supports: "FDA label, DOSAGE AND ADMINISTRATION, Repeated Intravenous Injection, VERBATIM: 'Initially, labetalol HCl injection should be given in a 20 mg dose (which corresponds to 0.25 mg/kg for an 80 kg patient) by slow intravenous injection over a 2 minute period.' And: 'Immediately before the injection and at 5 and 10 minutes after injection, supine blood pressure should be measured to evaluate response. Additional injections of 40 or 80 mg can be given at 10 minute intervals until a desired supine blood pressure is achieved or a total of 300 mg of labetalol HCl injection has been injected. The maximum effect usually occurs within 5 minutes of each injection.' Slow Continuous Infusion, VERBATIM: 'The diluted solution should be administered at a rate of 2 mL/min to deliver 2 mg/min' and 'The effective intravenous dose is usually in the range of 50 to 200 mg. A total dose of up to 300 mg may be required in some patients.' No boxed warning on this label. NOTE FOR THE CARD: the label's 20 mg initial dose is larger than the 5 to 10 mg increments the hypertension card currently teaches; the card's figure has no label source."
