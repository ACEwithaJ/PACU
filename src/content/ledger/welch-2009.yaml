supports: "The general perioperative nerve injury denominator Day 19 lacked. VERBATIM: 'Of all patients undergoing 380,680 anesthetics during a 10-yr period, 185 patients were initially identified as having nerve injuries, and after review, 112 met our definition of a perioperative nerve injury (frequency = 0.03%).' Associations found: hypertension, tobacco use, diabetes mellitus; general and epidural anaesthesia; neurosurgery, cardiac, general and orthopaedic surgery. QUALIFIERS THE PAGE MUST CARRY: injury was defined as a new sensory and/or motor deficit; nerve complications from the surgical procedure itself were EXCLUDED; case-finding was retrospective from quality assurance, closed claims and billing-code databases at a single tertiary care university hospital. This is a DETECTED AND REPORTED frequency, not a prospectively screened incidence, and should be presented as a lower bound."
