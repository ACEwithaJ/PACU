supports: "SECOND SOURCED VASOPRESSOR DOSE FOR THE HYPOTENSION CARD, and it matches what the card teaches. Section 1, VERBATIM: 'Ephedrine Sulfate Injection is indicated for the treatment of clinically important hypotension occurring in the setting of anesthesia.' Section 2.2, VERBATIM: 'The recommended dosages for the treatment of clinically important hypotension in the setting of anesthesia is an initial dose of 5 mg to 10 mg administered by intravenous bolus. Administer additional boluses as needed, not to exceed a total dosage of 50 mg. Adjust dosage according to the blood pressure goal (i.e., titrate to effect).' No boxed warning. Note the labelled ceiling of 50 mg total, which the card does not currently carry."
