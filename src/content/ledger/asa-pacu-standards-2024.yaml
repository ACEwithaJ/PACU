supports: "Standard V (verbatim): 'A PHYSICIAN IS RESPONSIBLE FOR THE DISCHARGE OF THE PATIENT FROM THE POSTANESTHESIA CARE UNIT. 1. When discharge criteria are used, they must be approved by the Department of Anesthesiology and the medical staff. They may vary depending upon whether the patient is discharged to a hospital room, to the ICU, to a short stay unit or home. 2. In the absence of the physician responsible for the discharge, the PACU nurse shall determine that the patient meets the discharge criteria. The name of the physician accepting responsibility for discharge shall be noted on the record.' Standard III: 'UPON ARRIVAL IN THE PACU, THE PATIENT SHALL BE RE-EVALUATED AND A VERBAL REPORT PROVIDED TO THE RESPONSIBLE NURSE BY THE MEMBER OF THE ANESTHESIA CARE TEAM WHO ACCOMPANIES THE PATIENT.' Also serves Day 16 (handover requirement)."
