supports: "DOES NOT SUPERSEDE chou-2016; use as an additional current UK-side citation. Recommendations box, VERBATIM: 'Throughout the peri-operative pathway and, where not contraindicated, multimodal analgesia should be encouraged, including paracetamol; non-steroidal anti-inflammatory drugs; a-2 adrenergic agonists; N-methyl-D-aspartate antagonists; corticosteroids; and regional analgesia.' Intra-operative, VERBATIM: 'Intra-operative analgesia should be multimodal and extend into the postoperative period.' General principles, VERBATIM: 'The principle of multimodal analgesia is that improved pain relief can be achieved by combining analgesics with different mechanisms of action that work synergistically' and 'Opioids continue to have a pivotal role in peri-operative pain management.' CRITICAL QUALIFIER, VERBATIM: 'Our methodology did not include a full systematic review with quantitative or qualitative synthesis, nor grading of recommendations, due to the breadth of the topic and expected heterogeneity in evidence.' The recommendations are therefore UNNUMBERED AND UNGRADED. Method was a four-round modified Delphi with a 75% consensus threshold; the document also says 'many of the recommendations are supported by modest evidence'. It cites Chou 2016 as its reference 2 rather than replacing it, is a UK document from different societies, and nowhere claims to supersede any prior guideline."
