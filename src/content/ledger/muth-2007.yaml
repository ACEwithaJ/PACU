supports: "PARTIAL ANSWER TO THE DAY 9 PLACEHOLDER, AND THE DIRECTOR SHOULD DECIDE WHETHER IT IS ENOUGH. Randomised, double-blind, placebo-controlled, between-subjects; 63 highly motion-sickness-susceptible subjects (23 men, 40 women, mean age 19.5 y); rotation at 20 rpm in darkness with coordinated head movements; ondansetron 24 mg as three 8 mg orally disintegrating tablets versus placebo versus dimenhydrinate 100 mg. VERBATIM: 'There were no differences between the groups in number of head movements tolerated, time rotating, or symptom questionnaire scores.' Conclusion VERBATIM: 'Neither ondansetron or dimenhydrinate prevented motion sickness in groups of highly susceptible people. Continued development of new treatments is necessary.' WHAT IT DOES NOT SHOW: this is ondansetron versus placebo for motion sickness. It is not a head-to-head demonstration that ondansetron is LESS effective against vestibular input than against other emetic inputs, which is how Day 9 currently frames the claim. It supports only the first half."
