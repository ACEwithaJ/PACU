supports: "FDA label, DOSAGE AND ADMINISTRATION, VERBATIM: 'As soon as the malignant hyperthermia reaction is recognized, all anesthetic agents should be discontinued; the administration of 100% oxygen is recommended. Dantrolene Sodium for Injection should be administered by continuous rapid intravenous push beginning at a minimum dose of 1 mg/kg, and continuing until symptoms subside or the maximum cumulative dose of 10 mg/kg has been reached. If the physiologic and metabolic abnormalities reappear, the regimen may be repeated.' NOTE THE CONFLICT WITH MHAUS: the label says a MINIMUM of 1 mg/kg and a MAXIMUM cumulative 10 mg/kg; MHAUS teaches 2.5 mg/kg initially and explicitly allows exceeding 10 mg/kg."
