supports: "FDA label section 1.1, VERBATIM: 'Nicardipine hydrochloride injection, USP is indicated for the short-term treatment of hypertension when oral therapy is not feasible or desirable.' Dosing, VERBATIM: 'For a gradual reduction in blood pressure, initiate therapy at a rate of 5 mg/hr. If desired blood pressure reduction is not achieved at this dose, increase the infusion rate by 2.5 mg/hr every 15 minutes up to a maximum of 15 mg/hr, until desired blood pressure reduction is achieved. For more rapid blood pressure reduction, titrate every 5 minutes.' Section 2.1, VERBATIM: 'Administer Nicardipine Hydrochloride by slow continuous infusion by a central line or through a large peripheral vein. Change the infusion site every 12 hours if administered via peripheral vein.' Section 2.5, on hypotension or tachycardia, VERBATIM: 'discontinue infusion. When blood pressure and heart rate stabilize, restart infusion at low doses such as 30 mL/hr to 50 mL/hr (3 mg/hr to 5 mg/hr) and titrate to maintain desired blood pressure.' No boxed warning on this label."
