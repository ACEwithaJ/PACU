supports: "FDA label, DOSAGE AND ADMINISTRATION, VERBATIM: 'When there is urgent need, therapy in the hospitalized patient may be initiated intramuscularly or as a rapid intravenous bolus injection directly into the vein. Hydralazine hydrochloride injection should be used only when the drug cannot be given orally. The usual dose is 20 to 40 mg, repeated as necessary.' And: 'Blood pressure should be checked frequently. It may begin to fall within a few minutes after injection, with the average maximal decrease occurring in 10 to 80 minutes. In cases where there has been increased intracranial pressure, lowering the blood pressure may increase cerebral ischemia.' No boxed warning on this label. NOTE FOR THE CARD: the label's usual dose is 20 to 40 mg, not the 5 to 10 mg the hypertension card currently teaches."
