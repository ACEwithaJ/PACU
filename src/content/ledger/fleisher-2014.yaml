supports: "PREDECESSOR ROW, kept only to show what changed. Class I recommendation, VERBATIM: 'Beta blockers should be continued in patients undergoing surgery who have been on beta blockers chronically.' Level of Evidence returned as B with an 'SR' annotation, which in that document marks recommendations supported by its commissioned systematic review; how the SR tag is typeset on the printed page could not be confirmed, so treat the LOE as B with the SR annotation uncertain. The 2024 ACC/AHA guideline is the current version and its wording differs, adding 'on stable doses' and 'as appropriate based on the clinical circumstances'."
