supports: "Adult and over-12 intramuscular adrenaline dose, VERBATIM: '500 micrograms IM (0.5 mL of 1 mg/ml adrenaline)'. Site, VERBATIM: 'The anterolateral aspect of the middle third of the thigh'. Repeat, VERBATIM: 'Repeat the IM adrenaline dose after 5 minutes if there is no improvement in the patient's condition.' Paediatric table: >12 y 500 micrograms; 6-12 y 300 micrograms; 6 months-6 y 150 micrograms; <6 months 100-150 micrograms; with the note 'Give 300 micrograms IM (0.3 mL) in a child who is small or prepubertal'. THIS IS THE OUT-OF-THEATRE COMPARATOR for the perioperative consensus figure of 300 micrograms in garvey-2019; the gap between 500 and 300 is the safety point Day 20 wants to teach. CURRENCY CAVEAT: the document's own stated review date of May 2026 has passed, but RCUK material dated February 2026 carries identical doses."
