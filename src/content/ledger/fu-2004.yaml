year: 2004
n: "Phase 1 n=45 (OR, patient-controlled: FiO2 0.21 n=25, 0.25 n=10, 0.30 n=10); phase 2 n=288 randomised in the PACU (room air 155, supplemental O2 133)"
access: paywalled
currency: era_limited
topic: oxygenation
claim_support: magnitude
supports: "Two-phase study in surgical patients, not volunteers. Phase 1 (OR, n=45): hypoventilation defined as a 50% reduction in minute ventilation; SpO2 declined only in the room-air group, with no decline at all at FiO2 0.25 or 0.30. Phase 2 (PACU, n=288, randomised room air vs supplemental O2, SpO2 every minute for up to 40 min): desaturation below SpO2 90% in 9.0% on room air vs 2.3% on supplemental O2, P=0.02. The direction is the teaching trap: supplemental oxygen removes the oximeter's hypoventilation signal."
found_via: "Cited in APSF newsletter correspondence, Univ of Florida virtual anesthesia machine teaching page, and a US patent specification; PDF subsequently held and extracted (docs/extraction-findings.md)"
