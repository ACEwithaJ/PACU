supports: Section V, Protocol for Discharge, states that the literature is insufficient to evaluate the benefits of requiring that patients urinate before discharge. The opinion survey reported alongside it records ASA member support for NOT requiring voiding before discharge at 85%, for requiring a responsible individual to accompany the patient home at 95%, and for not requiring a mandatory minimum stay in recovery at 85%. Requiring that patients drink water before discharge is listed among the interventions members did not support. This is the whole evidentiary basis for the day.
