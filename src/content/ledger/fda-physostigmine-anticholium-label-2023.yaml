supports: "THIS IS THE ROW DAY 13 AND THE DELAYED EMERGENCE CARD NEED. This label names the indication explicitly, VERBATIM: 'the treatment of postoperative disorders: Central anticholinergic syndrome (CAS), Delayed postoperative awakening, Shivering'. Adult dose, VERBATIM: 'Slowly inject physostigmine intravenously at a dose of 0.04 mg/kg bodyweight (approx. 1 mg/min), the maximum individual dose is 2 mg.' And: 'In case of insufficient effect, give subsequent injections after 5 to 20 minutes at the earliest.' Administration, VERBATIM: 'Intravenously slowly or as brief infusion in 50 ml physiological saline solution over 10-15 minutes.' Harms, VERBATIM: 'Bradycardia and convulsions, if intravenous administration is too rapid'; 'An overdose of ANTICHOLIUM can cause bradycardia, hypersalivation, vomiting, and generalized tonic-clonic seizures. Patients should be closely monitored by ECG'; and 'Acute cardiac arrest may be possible during treatment with tricyclic antidepressants; therefore, Anticholium should only be considered as an antidote for this indication while the patient has continuous ECG monitoring.' NOTE THE DIVERGENCE FROM THE CARD: the card teaches 0.5 to 2 mg; this label teaches 0.04 mg/kg to a maximum single dose of 2 mg. No label examined contains the word asystole. CAVEAT: some warnings text returned in patient-facing phrasing, so section headings should be re-checked before being cited as Warnings and Precautions."
