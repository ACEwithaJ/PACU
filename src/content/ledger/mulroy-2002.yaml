supports: "Also serves Day 15. Low-risk ambulatory patients (age <70, no hernia/rectal/urologic surgery, no voiding history) after short-acting spinal/epidural (procaine, lidocaine, 2-chloroprocaine, <7 mg bupivacaine, no epinephrine). Standard pathway (n=70) required voiding: discharged 153 +/- 49 min. Accelerated (n=131) not required: 62 voided (127 +/- 41 min); 46 discharged with bladder ultrasound <400 ml (120 +/- 42); 23 had >400 ml, of whom 20 voided within 1 h and 3 were catheterized. Accelerated pathway 22 min shorter (P=0.002); no urinary problems or returns."
