supports: "FIRST SOURCED VASOPRESSOR DOSE FOR THE HYPOTENSION CARD. Section 1, VERBATIM: 'BIORPHEN is indicated for the treatment of clinically important hypotension resulting primarily from vasodilation in the setting of anesthesia.' Section 2, VERBATIM: 'Initial dose is 40 mcg to 100 mcg administered by intravenous bolus. Additional boluses up to 200 mcg may be administered every 1 to 2 minutes as needed.' Infusion after dilution, VERBATIM: '10 mcg/min to 35 mcg/min, titrating to effect, not to exceed 200 mcg/min.' No boxed warning. IMPORTANT DIVERGENCE BETWEEN PRODUCTS: the ready-to-use premix (Phenylephrine Hydrochloride in 0.9% Sodium Chloride Injection, Dr. Reddy's, set ID 71b8fb8a-e13a-246f-f7b4-aa912b9ccd54, revised June 2025) gives a different bolus, VERBATIM: '50 mcg to 250 mcg by intravenous bolus administration'. The card's current figure of 50 to 100 micrograms matches neither label exactly. Cite a product, not a range."
