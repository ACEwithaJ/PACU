supports: "FDA label, DOSAGE AND ADMINISTRATION, VERBATIM: 'Revonto should be administered by continuous rapid intravenous push beginning at a minimum dose of 1 mg/kg, and continuing until symptoms subside or the maximum cumulative dose of 10 mg/kg has been reached. If the physiologic and metabolic abnormalities reappear, the regimen may be repeated.' This is the third of the three dantrolene SPLs named in the round 3 table; the Hikma and Ryanodex rows carry the other two. All three agree on minimum 1 mg/kg and maximum cumulative 10 mg/kg, and all three conflict with the MHAUS figure of 2.5 mg/kg."
