supports: "Randomised, open-label, controlled trial; 1:1 block randomisation, sealed opaque envelopes. Catheterisation occurred in 114/354 (32.2%) in the 500 ml arm versus 49/367 (13.4%) in the 800 ml arm; RR 0.4 (95% CI 0.3-0.6; P<0.0001). 'No difference between groups in any secondary outcome', including urinary tract infection (2% in both arms) and urology-related readmissions. Conclusion VERBATIM: 'In fast-track THA and TKA, a catheterization threshold of 800 ml significantly reduced the need for postoperative urinary catheterization, without increasing urological complications.' TWO CAVEATS: the population is fast-track hip and knee arthroplasty INPATIENTS under spinal anaesthesia, not ambulatory patients and not peripheral nerve block; and 800 ml was a CATHETERISE-AT threshold, not a demonstration that patients were left at 800 ml untreated."
