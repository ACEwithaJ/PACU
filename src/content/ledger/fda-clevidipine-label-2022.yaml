supports: "FDA label section 2.2, VERBATIM: 'Initiate the intravenous infusion of Cleviprex at 1-2 mg/hour.' And: 'The dose may be doubled at short (90 second) intervals initially. As the blood pressure approaches goal, the increase in doses should be less than doubling and the time between dose adjustments should be lengthened to every 5-10 minutes. An approximately 1-2 mg/hour increase will generally produce an additional 2-4 mmHg decrease in systolic pressure.' And: 'The desired therapeutic response for most patients occurs at doses of 4-6 mg/hour. Patients with severe hypertension may require doses up to 32 mg/hour, but there is limited experience at this dose rate.' Lipid-load limit, VERBATIM: 'Because of lipid load restrictions, no more than 1000 mL or an average of 21 mg/hour of Cleviprex infusion is recommended per 24 hour period.' Section 2.1, VERBATIM: 'Patients who receive prolonged Cleviprex infusions and are not transitioned to other antihypertensive therapies should be monitored for the possibility of rebound hypertension for at least 8 hours after the infusion is stopped.' No boxed warning on this label. Note: the DailyMed product title prints the drug name as 'clevipidine', a typographical error in the label title."
