supports: "Retrospective analysis with a prospective neurological protocol (pre- and post-operative examination in all patients, EMG and nerve conduction studies at 7 days, 4 weeks and 6 months). Brachial plexus injury in 3 of 575 (0.5%). Mechanism, VERBATIM: 'The common feature was that in all cases the left internal mammary artery was harvested.' Timing: onset after extubation, within the first three postoperative days. Outcome, VERBATIM: 'While the symptoms were relieved in two patients about six months after the operation, the other one had intractable pain and paresthesia.' SCOPE CAVEAT: cardiac surgery and sternal retraction only. This is NOT a general perioperative brachial plexus injury rate. The general source, Welch 2009 Anesthesiology, could not be opened."
