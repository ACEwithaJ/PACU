supports: Current PONV guideline, in print September 2026 (online ahead of print 14 November 2025); supersedes the Fourth Consensus Guidelines. Graded statements read from the full text include A1 evidence that low-dose gabapentinoids (<300 mg pregabalin/day or <900 mg gabapentin/day) reduce PONV risk despite showing no significant analgesic efficacy, and A1 that opioid-free anaesthesia reduces PONV versus opioid-based anaesthesia; also cautions that nonselective NSAIDs may be associated with anastomotic leak in gastrointestinal surgery.
