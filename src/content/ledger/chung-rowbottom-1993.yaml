supports: "Primary support for the low-dose succinylcholine rung of the laryngospasm ladder, and it is thin. Summary VERBATIM: 'Intravenous suxamethonium, in a dose as small as 0.1 mg.kg-1, has been found to be reliable in the treatment of laryngeal spasm. Three episodes of vocal cord spasm observed during direct laryngoscopy were relieved by this dose of suxamethonium.' PubMed publication type Case Reports. QUALIFIER: this is three episodes. The Wiley HTML page carries only the Summary and the body did not render, so the number of individual patients was NOT READ. The word reliable is the authors claim about three episodes, not a measured reliability. DOI CORRECTION: the DOI ends tb06908; tb06907 is a different article entirely (Grace and Orr, continuous spinal anaesthesia, same issue, pages 226-228)."
