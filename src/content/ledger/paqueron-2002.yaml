supports: "Makes the day's claim directly: 73 PACU patients titrated with morphine; 52 slept, 21 did not; titration stopped at sleep. Ramsay 1.7 (0.4) -> 2.4 (0.6) and BIS 95 (5.0) -> 89.8 (10.2) at sleep onset; VAS fell comparably in both groups (78 -> 39 sleep, 64 -> 30.4 awake); 13/52 sleepers (25%) still had VAS >50 mm at 30 min. Conclusion: sedation precedes analgesia and is not an indicator of adequate analgesia."
