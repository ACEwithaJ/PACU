supports: "ANSWERS THE DAY 3 PLACEHOLDER, AND NOT IN THE DIRECTION THE PLACEHOLDER ASSUMES. Prospective multicentre blinded observational trial in adult PACU; capnography and oximetry recorded blinded alongside standard monitoring. Supplemental oxygen, VERBATIM: 'The average supplemental O2 rate in the PACU was 3.8+/-2.4 L/min, delivered to 81 patients by mask and 82 patients by nasal cannula; 82% of patients were transported out of the PACU with supplemental O2.' Level I thresholds: apnea >=10 s twice in a 15 min epoch; bradypnea <=6 bpm for more than 30 s; hypercapnia EtCO2 >=60 mmHg for more than 30 s. Incidence, VERBATIM: 'Within Level I notifcations, 2 patients had hypercapnia, 48 had hypocapnia, 113 had apnea, 6 had tachypnea, and 53 had bradypnea.' (sic, typo in the published text.) Also VERBATIM: '163 (95%) patients had a Level II notification and 135 (78%) had a Level I notification during standard monitoring.' READ THIS CAREFULLY BEFORE USING IT: on ~3.8 L/min of oxygen, capnography found apnoea in 113 of 172 and bradypnoea in 53 of 172, but measured hypercapnia in only 2 of 172. The day must not say 'hypercapnia is common in the PACU on oxygen'; this study says the opposite. What is common is apnoea and bradypnoea, which the oximeter also does not show."
