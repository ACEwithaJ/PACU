supports: "Systematic summary of 242 published episodes of local anaesthetic-related methaemoglobinaemia: SpO2 <=90% with PaO2 >=70 mmHg discrepancy in 91.8%; SpO2 minus co-oximetry difference -6.2% to 44.7%; a single spray of benzocaine may induce methaemoglobinaemia; coma reported at MetHb 32.2% (children) and 29.1% (adults); rebound MetHb up to 59.9% up to 18 h after methylene blue with mucosal benzocaine; complications include hypoxic encephalopathy, MI and death; conclusion 'Benzocaine should no longer be used'. Prilocaine adult limit 5.0 mg/kg. PubMed pubtype: Meta-Analysis."
