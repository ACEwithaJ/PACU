supports: "Estimated incidence ~1:10,000 anaesthetics (true incidence possibly ~70% higher). Culprits (199 identified): antibiotics 94, NMBAs 65, chlorhexidine 18, Patent Blue 9; NO local anaesthetic or LATEX cases. Presenting features: hypotension 46%, bronchospasm 18%, tachycardia 9.8%, desaturation 4.7%, bradycardia 3%, reduced/absent capnography 2.3%; all hypotensive at some point. Onset rapid for NMBAs/antibiotics but DELAYED with chlorhexidine and Patent Blue. 10 deaths, 40 cardiac arrests (PEA usual, often with bradycardia); poor outcome associated with ASA class, obesity, beta-blockers, ACE inhibitors."
