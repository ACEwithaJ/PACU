supports: "Grading (modified Ring and Messmer, Table 1): I skin/mucosal only; II moderate multi-organ; III life-threatening hypotension/tachy- or bradycardia/severe bronchospasm; IV cardiac or respiratory arrest; skin signs may be absent in III/IV until perfusion restored. Table 4 adult doses: Grade II i.v. epinephrine 20 microg, escalate to 50 microg at 2 min, repeat q2 min, 300 microg i.m. if no i.v. access, crystalloid 500 ml; Grade III 50 microg (100 microg if unresponsive to other vasopressors), escalate to 200 microg at 2 min, crystalloid 1 L repeated up to 30 ml/kg; Grade IV 1 mg per ALS, ECM if SBP <50 mmHg or EtCO2 <3 kPa; refractory >10 min: double dose, infusion 0.05-0.1 microg/kg/min after >3 boluses, vasopressin 1-2 IU, glucagon 1-2 mg if beta-blocked, norepinephrine 0.05-0.5 microg/kg/min, ECLS. Tryptase at 1 h, 2-4 h, baseline >=24 h. 'Sugammadex has no immediate role in resuscitation of suspected anaphylaxis.'"
