supports: "SECOND PHYSOSTIGMINE LABEL, AND IT IS AN UNAPPROVED PRODUCT. The DailyMed page carries the FDA disclaimer VERBATIM: 'This drug has not been found by FDA to be safe and effective, and this labeling has not been approved by FDA.' Indication, VERBATIM: 'To reverse the effect upon the central nervous system, caused by clinical or toxic dosages of drugs capable of producing the anticholinergic syndrome.' Dose as printed: 'Past Anesthesia Care: 0.5 to 1.0 mg intramuscularly or intravenously. INTRAVENOUS ADMINISTRATION SHOULD BE AT A SLOW CONTROLLED RATE OF NO MORE THAN 1 MG PER MINUTE. Dosage may be repeated at intervals of 10 to 30 minutes if desired patient response is not obtained.' The words 'Past Anesthesia Care' are as returned and are probably a typographical error for 'Post Anesthesia Care'; VERIFY THE WORD BEFORE QUOTING. Warnings, VERBATIM: 'Rapid administration can cause bradycardia, hypersalivation leading to respiratory difficulties and possible convulsions.' Precautions, VERBATIM: 'Because of the possibility of hypersensitivity in an occasional patient, atropine sulfate injection should always be at hand since it is an antagonist and antidote for physostigmine.' The 0.5 to 1.0 mg figure the card teaches matches THIS label, which is the unapproved one, not the approved Anticholium label. The director should decide which to cite, and say which."
