name: bootstrap

# The toolchain bridge. The director's machine has no Node, so the parts of
# the work that must execute (generate package-lock.json, run the ledger
# import, regenerate docs/content-review.md, run the validator and the build)
# happen here. Modelled on the sibling project's bootstrap-lockfile workflow.
#
# Runs on every push to any branch except main.
#
# Two outputs:
#   1. Generated files (lockfile, ledger YAML, debt file, content review) are
#      committed back to the branch ONLY when they changed. A bot commit moves
#      the PR head without triggering ci.yml (GITHUB_TOKEN pushes never do),
#      so after one the author must push again for the required check to run.
#      The job says so in its summary.
#   2. The full pipeline log goes to the `ci-reports` branch as
#      reports/<branch>.md, never to the working branch, so the PR head does
#      not move on every run. Read it with:
#        git fetch origin ci-reports && git show origin/ci-reports:reports/<branch>.md

on:
  push:
    branches-ignore: ["main"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bootstrap-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install (generates package-lock.json if absent)
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Ledger import (writes only files that do not exist yet)
        run: npm run ledger:import

      - name: Self-test, validate, build — captured
        id: pipeline
        continue-on-error: true
        run: |
          set -o pipefail
          mkdir -p .ci
          {
            echo "# CI report — ${GITHUB_REF_NAME}"
            echo
            echo "Commit: ${GITHUB_SHA}  ·  Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo
            echo '## node -v'; echo '```'; node -v; echo '```'
            echo
            echo '## npm run validate:selftest'; echo '```'
          } > .ci/REPORT.md
          st=0
          npm run validate:selftest 2>&1 | tee -a .ci/REPORT.md || st=1
          echo '```' >> .ci/REPORT.md
          echo >> .ci/REPORT.md
          echo '## npm run validate' >> .ci/REPORT.md; echo '```' >> .ci/REPORT.md
          npm run validate 2>&1 | tee -a .ci/REPORT.md || st=1
          echo '```' >> .ci/REPORT.md
          echo >> .ci/REPORT.md
          echo '## npm run build' >> .ci/REPORT.md; echo '```' >> .ci/REPORT.md
          npm run build 2>&1 | tee -a .ci/REPORT.md || st=1
          echo '```' >> .ci/REPORT.md
          echo >> .ci/REPORT.md
          echo '## Day 3 render markers (dist/d/day-03/index.html)' >> .ci/REPORT.md
          echo '```' >> .ci/REPORT.md
          f=dist/d/day-03/index.html
          if [ -f "$f" ]; then
            for m in 'class="draft-banner"' 'chip mode' 'Consensus only' 'id="src-fu-2004"' 'href="#src-fu-2004"' 'https://doi.org/' 'badge paywalled' 'id="quiz"' 'Progress is not saved' 'data-quiz-item' '<h2 id="check-yourself"' 'NUMBER NEEDED'; do
              printf '%-28s %s\n' "$m" "$(grep -o -F "$m" "$f" | wc -l)"
            done >> .ci/REPORT.md
          else
            echo "$f not built" >> .ci/REPORT.md
          fi
          echo '```' >> .ci/REPORT.md
          echo >> .ci/REPORT.md
          echo "## Result: $([ $st = 0 ] && echo GREEN || echo RED)" >> .ci/REPORT.md
          exit $st

      - name: Commit generated files (only if they changed)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A package-lock.json src/content/ledger docs/ledger-debt.md docs/content-review.md
          if git diff --cached --quiet; then
            echo "generated files unchanged; PR head not moved"
          else
            git commit -m "ci: generated files (lockfile / ledger YAML / debt / content review)"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin HEAD:"${GITHUB_REF_NAME}"
            echo "::warning::generated files were committed to ${GITHUB_REF_NAME}. The PR head moved and ci.yml did not run on it — push again so the required check runs."
            echo "### Generated files committed — push again so ci runs on the new head" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Publish the report to the ci-reports branch
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -e
          rep=$(mktemp -d)
          cd "$rep"
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git fetch -q origin ci-reports 2>/dev/null; then
            git checkout -q -b ci-reports FETCH_HEAD
          else
            git checkout -q --orphan ci-reports
            echo "# CI reports" > README.md
            echo "One file per branch, overwritten on every bootstrap run. Read with: git show origin/ci-reports:reports/<branch>.md" >> README.md
          fi
          mkdir -p reports
          cp "${GITHUB_WORKSPACE}/.ci/REPORT.md" "reports/${GITHUB_REF_NAME}.md"
          git add -A
          git commit -q -m "report: ${GITHUB_REF_NAME} @ ${GITHUB_SHA::7}" || echo "report unchanged"
          git push -q origin HEAD:ci-reports
          cat "${GITHUB_WORKSPACE}/.ci/REPORT.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload dist
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7
          if-no-files-found: ignore

      - name: Fail the job if the pipeline failed
        if: steps.pipeline.outcome == 'failure'
        run: |
          echo "pipeline failed — see reports/${GITHUB_REF_NAME}.md on the ci-reports branch"
          exit 1
