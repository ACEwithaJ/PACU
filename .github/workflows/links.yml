name: links

# Execution brief 6.2; planning brief D7. This is the review process, in
# Phase 0: every source link on the built site is checked weekly and a
# failure opens an issue. Separate from ci.yml on purpose — a publisher
# outage must not block a content edit from building.
#
# Monday 06:00 America/New_York = 11:00 UTC (10:00 UTC in summer; close enough).

on:
  schedule:
    - cron: "0 11 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Check links in dist/**/*.html
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          # --base lets root-relative links (/d/day-03/) resolve inside dist.
          # doi.org answers 302 and PubMed sometimes 403s bots; both are accepted
          # so the check reports dead links, not rate limits.
          args: >-
            --no-progress
            --base dist
            --accept 200,201,202,203,204,206,301,302,303,307,308,403,429
            --max-retries 3
            --timeout 30
            'dist/**/*.html'
          fail: false
          output: ./lychee/out.md

      - name: Open an issue when links are broken
        if: steps.lychee.outputs.exit_code != 0
        uses: peter-evans/create-issue-from-file@v5
        with:
          title: "Weekly link check failed"
          content-filepath: ./lychee/out.md
          labels: links, automated
